name: CI

on:
  push:
    branches: [dev, release]
  pull_request:
  workflow_dispatch:
    inputs:
      native:
        description: Also build and smoke-test the native binaries
        type: boolean
        default: false

permissions:
  contents: write

env:
  # Runners have no GPU: keep WebKit on the software path, and GTK on X11 for Xvfb.
  GDK_BACKEND: x11
  WEBKIT_DISABLE_DMABUF_RENDERER: "1"
  WEBKIT_DISABLE_COMPOSITING_MODE: "1"

jobs:
  test:
    name: Tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Install GTK, WebKitGTK and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0 libxtst6 xvfb

      - name: Headless tests
        run: ./gradlew test

      # A display test that silently skips on CI is a false pass.
      - name: Display tests under Xvfb
        run: xvfb-run -a ./gradlew displayTest -Dwebview.requireDisplay=true -Dwebview.screenshots=true

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-linux
          path: '**/build/screenshots/'
          if-no-files-found: error

      - name: Jars and Javadoc
        run: ./gradlew assemble javadoc

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-linux
          path: |
            **/build/reports/tests/
            **/build/test-results/

  test-windows:
    name: Tests (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Headless tests
        run: ./gradlew test

      # The runner's session has a desktop, so WebView2 can attach; no Xvfb equivalent needed.
      - name: Display tests
        run: ./gradlew displayTest "-Dwebview.requireDisplay=true" "-Dwebview.screenshots=true"

      - name: Screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: screenshots-windows
          path: '**/build/screenshots/'
          if-no-files-found: error

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-windows
          path: |
            **/build/reports/tests/
            **/build/test-results/

  test-macos:
    name: Tests (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Headless tests
        run: ./gradlew test

      # The runner's session has a window server, so AppKit windows come up without any display setup. No
      # screenshots: AWT's Robot would bring a second NSApplication into a process that already runs one.
      - name: Display tests
        run: ./gradlew displayTest -Dwebview.requireDisplay=true

      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports-macos-${{ matrix.arch }}
          path: |
            **/build/reports/tests/
            **/build/test-results/

  # Everything below runs only for the release branch, or on request.

  version:
    name: Version
    if: github.ref == 'refs/heads/release' || inputs.native
    runs-on: ubuntu-latest
    needs: [test, test-windows, test-macos]
    outputs:
      version: ${{ steps.semver.outputs.version }}
      version_tag: ${{ steps.semver.outputs.version_tag }}
      is_tagged: ${{ steps.semver.outputs.is_tagged }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Calculate semantic version
        id: semver
        uses: paulhatch/semantic-version@v6.0.3
        with:
          tag_prefix: v
          major_pattern: '/!:|BREAKING CHANGE:/'
          minor_pattern: '/feat(\(.+\))?:/'
          version_format: '${major}.${minor}.${patch}'
          bump_each_commit: false
          search_commit_body: true

      - name: Verify build version
        shell: bash
        env:
          PROJECT_VERSION: ${{ steps.semver.outputs.version }}
        run: |
          [[ "$PROJECT_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          gradle_version="$(
            ./gradlew --no-daemon properties -q -PprojectVersion="$PROJECT_VERSION" |
              sed -n 's/^version: //p'
          )"
          test "$gradle_version" = "$PROJECT_VERSION"

  native-linux:
    name: Native image (Linux)
    runs-on: ubuntu-latest
    needs: version
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build native binary in container
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.native
          outputs: type=local,dest=build/native-docker
          build-args: PROJECT_VERSION=${{ needs.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install runtime libraries and Xvfb
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-3-0t64 libwebkit2gtk-4.1-0 xvfb python3

      - name: Smoke test the binary
        run: xvfb-run -a scripts/native-smoke.sh build/native-docker/webview-jvm-example

      - run: mv build/native-docker/webview-jvm-example webview-jvm-example-linux-x86_64

      - uses: actions/upload-artifact@v7
        with:
          name: webview-jvm-example-linux-x86_64
          path: webview-jvm-example-linux-x86_64

  native-windows:
    name: Native image (Windows)
    runs-on: windows-latest
    needs: version
    steps:
      - uses: actions/checkout@v7

      # Also puts the Visual Studio toolchain native-image needs on the PATH; the Gradle plugin finds the
      # toolchain through GRAALVM_HOME, which this step exports.
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm-community

      # Gradle itself runs on the same JDK as the test jobs: its daemon does not start reliably on the
      # GraalVM JDK on the Windows runner ("Could not dispatch a message to the daemon").
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build native binary
        run: ./gradlew :webview-jvm-example:nativeCompile "-PprojectVersion=${{ needs.version.outputs.version }}"

      - name: Smoke test the binary
        shell: bash
        run: scripts/native-smoke.sh webview-jvm-example/build/native/nativeCompile/webview-jvm-example.exe

      - shell: bash
        run: mv webview-jvm-example/build/native/nativeCompile/webview-jvm-example.exe webview-jvm-example-windows-x86_64.exe

      - uses: actions/upload-artifact@v7
        with:
          name: webview-jvm-example-windows-x86_64
          path: webview-jvm-example-windows-x86_64.exe

  native-macos:
    name: Native image (macOS ${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: 25
          distribution: graalvm-community

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Build native binary
        run: ./gradlew :webview-jvm-example:nativeCompile "-PprojectVersion=${{ needs.version.outputs.version }}"

      - name: Smoke test the binary
        run: scripts/native-smoke.sh webview-jvm-example/build/native/nativeCompile/webview-jvm-example

      - run: mv webview-jvm-example/build/native/nativeCompile/webview-jvm-example webview-jvm-example-macos-${{ matrix.arch }}

      - uses: actions/upload-artifact@v7
        with:
          name: webview-jvm-example-macos-${{ matrix.arch }}
          path: webview-jvm-example-macos-${{ matrix.arch }}

  publish:
    name: Publish
    if: github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    needs: [version, native-linux, native-windows, native-macos]
    env:
      PROJECT_VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v6

      - name: Publish to the Maven repository
        env:
          REPOSILITE_USERNAME: ${{ secrets.REPOSILITE_USERNAME }}
          REPOSILITE_PASSWORD: ${{ secrets.REPOSILITE_PASSWORD }}
        run: ./gradlew publish -PprojectVersion="$PROJECT_VERSION"

      - uses: actions/download-artifact@v8
        with:
          pattern: webview-jvm-example-*
          merge-multiple: true
          path: binaries

      # Creates the tag through the API: unlike a git push with GITHUB_TOKEN, that is not blocked when
      # the released commit touches .github/workflows/*.
      - name: Tag and GitHub release with the example binaries
        if: needs.version.outputs.is_tagged != 'true'
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.version.outputs.version_tag }}
          target_commitish: ${{ github.sha }}
          generate_release_notes: true
          files: binaries/*
